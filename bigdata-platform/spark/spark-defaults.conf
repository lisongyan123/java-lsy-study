spark.master                              spark://spark-master:7077
spark.serializer                          org.apache.spark.serializer.KryoSerializer
spark.sql.catalogImplementation           hive
spark.hadoop.hive.metastore.uris          thrift://hive-metastore:9083

# Local offline JAR directories are mounted on every Spark container.
spark.driver.extraClassPath                /opt/spark/jars-common/*:/opt/spark/jars-extra/*
spark.executor.extraClassPath              /opt/spark/jars-common/*:/opt/spark/jars-extra/*

# Iceberg JDBC Catalog shared with Trino and Flink.
spark.sql.extensions                      org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.apache.spark.sql.hudi.HoodieSparkSessionExtension
spark.sql.catalog.iceberg                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.catalog-impl     org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.iceberg.uri              jdbc:mysql://mysql-cdc:3306/iceberg_catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spark.sql.catalog.iceberg.jdbc.user        iceberg
spark.sql.catalog.iceberg.jdbc.password    iceberg
spark.sql.catalog.iceberg.warehouse        s3://warehouse/iceberg
spark.sql.catalog.iceberg.io-impl          org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint      http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.catalog.iceberg.s3.access-key-id minioadmin
spark.sql.catalog.iceberg.s3.secret-access-key minioadmin
spark.sql.catalog.iceberg.s3.region        us-east-1

# Hudi uses Spark's Hive-backed session catalog and S3A storage.
spark.sql.catalog.spark_catalog            org.apache.spark.sql.hudi.catalog.HoodieCatalog
spark.hadoop.fs.s3a.endpoint               http://minio:9000
spark.hadoop.fs.s3a.path.style.access      true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.access.key             minioadmin
spark.hadoop.fs.s3a.secret.key             minioadmin
spark.hadoop.fs.s3a.impl                   org.apache.hadoop.fs.s3a.S3AFileSystem
