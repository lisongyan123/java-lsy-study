connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=iceberg
iceberg.jdbc-catalog.driver-class=com.mysql.cj.jdbc.Driver
iceberg.jdbc-catalog.connection-url=jdbc:mysql://mysql-cdc:3306/${ENV:ICEBERG_CATALOG_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
iceberg.jdbc-catalog.connection-user=${ENV:ICEBERG_CATALOG_USER}
iceberg.jdbc-catalog.connection-password=${ENV:ICEBERG_CATALOG_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=${ENV:ICEBERG_WAREHOUSE}
iceberg.file-format=PARQUET
iceberg.compression-codec=SNAPPY

fs.native-s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.region=${ENV:MINIO_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
