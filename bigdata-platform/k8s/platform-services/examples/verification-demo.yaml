# 验证用工作负载：通过环境变量引用原生 ConfigMap/Secret，
# 通过 Service 自动注册到 EndpointSlice，并由 Ingress 对外暴露。
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-demo-nginx-template
  namespace: platform-services
data:
  default.conf.template: |
    server {
      listen 8080;
      server_name _;

      location = /ready {
        default_type text/plain;
        return 200 "ready\n";
      }

      location = /config {
        default_type text/plain;
        alias /usr/share/nginx/html/config;
      }

      location / {
        default_type text/plain;
        return 200 "service=orders\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-demo
  namespace: platform-services
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: platform-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/part-of: platform-services
    spec:
      containers:
        - name: orders
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              cp /etc/nginx/templates/default.conf.template /etc/nginx/conf.d/default.conf
              {
                echo 'service=orders'
                for config_file in /etc/platform-config/*; do
                  [ -f "$config_file" ] || continue
                  printf '%s=%s\n' "$(basename "$config_file")" "$(cat "$config_file")"
                done | sort
              } > /usr/share/nginx/html/config
              exec nginx -g 'daemon off;'
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
            - name: platform-config
              mountPath: /etc/platform-config
              readOnly: true
      volumes:
        - name: nginx-template
          configMap:
            name: orders-demo-nginx-template
        - name: platform-config
          configMap:
            name: platform-config
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: platform-services
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: platform-services
spec:
  selector:
    app.kubernetes.io/name: orders
  ports:
    - name: http
      port: 8080
      targetPort: http
