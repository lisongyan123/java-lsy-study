apiVersion: v1
kind: Namespace
metadata:
  name: bigdata-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: bigdata-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-runner
  namespace: bigdata-platform
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups: [""]
    resources:
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-runner
  namespace: bigdata-platform
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: bigdata-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-runner