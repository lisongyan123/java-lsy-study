# 示例文件不会被 kustomization.yaml 加载。复制到安全位置并替换全部 change-me 后再创建 Secret。
apiVersion: v1
kind: Secret
metadata:
  name: spark-iceberg-secret
  namespace: bigdata-platform
type: Opaque
stringData:
  MINIO_ROOT_USER: change-me
  MINIO_ROOT_PASSWORD: change-me
  ICEBERG_CATALOG_USER: change-me
  ICEBERG_CATALOG_PASSWORD: change-me
