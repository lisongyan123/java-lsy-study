apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-events
  namespace: bigdata-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: bigdata-platform
  labels:
    app: spark-history-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      containers:
        - name: history-server
          image: apache/spark:3.5.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              mkdir -p /opt/spark-events
              exec /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
          env:
            - name: SPARK_HISTORY_OPTS
              value: >-
                -Dspark.history.fs.logDirectory=file:/opt/spark-events
                -Dspark.history.ui.port=18080
                -Dspark.history.fs.update.interval=10s
                -Dspark.history.retainedApplications=50
          ports:
            - name: http
              containerPort: 18080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: spark-events
              mountPath: /opt/spark-events
      volumes:
        - name: spark-events
          persistentVolumeClaim:
            claimName: spark-events
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: bigdata-platform
  labels:
    app: spark-history-server
spec:
  type: ClusterIP
  selector:
    app: spark-history-server
  ports:
    - name: http
      port: 18080
      targetPort: http