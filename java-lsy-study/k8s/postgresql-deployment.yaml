---
# 1. 创建 Secret 存储密码（密码明文是：postgresql，Base64编码是：cG9zdGdyZXNxbA==）
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secrets
  namespace: default
type: Opaque
data:
  POSTGRESQL_PASSWORD: cG9zdGdyZXNxbA==
  POSTGRESQL_POSTGRES_PASSWORD: cG9zdGdyZXNxbA==

---
# 2. 创建 Deployment（Pod）—— 使用临时目录，避免 PV 问题e
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-deployment
  namespace: default
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql 
          image: bitnamilegacy/postgresql:17.6.0-debian-12-r4
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USERNAME
              value: "postgres"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_DATABASE
              value: "myappdb"
            - name: POSTGRESQL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: POSTGRESQL_POSTGRES_PASSWORD
            - name: BITNAMI_DEBUG
              value: "false"
            # 使用临时目录，避免 PersistentVolumeClaim 问题
            - name: POSTGRESQL_DATA_DIR
              value: "/tmp/postgresql/data"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
# 3. 创建 Service，暴露为 NodePort，供 DataGrip 访问
apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: postgresql
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30000  # 固定端口，方便连接（范围：30000–32767）