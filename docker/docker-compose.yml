version: '3.8'

services:
  # ============ MinIO：对象存储 ============
  minio:
    image: minio/minio:latest
    container_name: iceberg-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - iceberg-net

  # ============ Nessie：元数据管理 ============
  nessie:
    image: projectnessie/nessie:latest
    container_name: iceberg-nessie
    ports:
      - "19120:19120"
    environment:
      QUARKUS_HTTP_PORT: 19120
      NESSIE_VERSION_STORE_TYPE: IN_MEMORY
      # 禁用 OpenTelemetry
      QUARKUS_OPENTELEMETRY_ENABLED: "false"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:19120/api/v1/config" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - iceberg-net

  # ============ Jupyter：只装 pyiceberg ============
  jupyter:
    image: jupyter/minimal-notebook:latest
    container_name: iceberg-jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: "iceberg"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_REGION: us-east-1
    volumes:
      - ./data/jupyter:/home/jovyan/work
    user: root
    depends_on:
      - nessie
      - minio
    networks:
      - iceberg-net
    command: >
      bash -c "
        pip install pyiceberg[s3fs] &&
        start-notebook.sh
      "

networks:
  iceberg-net:
    driver: bridge